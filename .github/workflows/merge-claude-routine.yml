name: Merge Claude routine state

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-claude-routine-main
  cancel-in-progress: false

jobs:
  validate-and-merge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/routine-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            claude/routine-pre-market-*)
              state_file="memory/RESEARCH-LOG.md"
              archive_prefix="memory/archive/RESEARCH-LOG-"
              ;;
            claude/routine-market-open-*|claude/routine-midday-*|claude/routine-daily-summary-*)
              state_file="memory/TRADE-LOG.md"
              archive_prefix="memory/archive/TRADE-LOG-"
              ;;
            claude/routine-weekly-review-*)
              state_file="memory/WEEKLY-REVIEW.md"
              archive_prefix="memory/archive/WEEKLY-REVIEW-"
              ;;
            claude/routine-rebalance-*)
              state_file="memory/REBALANCE-LOG.md"
              second_state_file="memory/TRADE-LOG.md"
              archive_prefix="memory/archive/REBALANCE-LOG-"
              second_archive_prefix="memory/archive/TRADE-LOG-"
              ;;
            *)
              echo "Unrecognized routine branch: $HEAD_BRANCH" >&2
              exit 1
              ;;
          esac

          mapfile -t changes < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | [.filename, .status] | @tsv'
          )

          if (( ${#changes[@]} == 0 )); then
            echo "PR contains no changed files" >&2
            exit 1
          fi

          state_changed=false
          for change in "${changes[@]}"; do
            IFS=$'\t' read -r filename status <<< "$change"

            if [[ "$status" != "modified" && "$status" != "added" ]]; then
              echo "Only state-log modifications and archive additions are allowed: $filename ($status)" >&2
              exit 1
            fi

            permitted=false
            if [[ "$filename" == "$state_file" || "$filename" == "${second_state_file:-}" ]]; then
              if [[ "$status" == "modified" ]]; then
                permitted=true
                state_changed=true
              fi
            elif [[ "$filename" =~ ^${archive_prefix}[0-9]{4}\.md$ ||
                    ( -n "${second_archive_prefix:-}" && "$filename" =~ ^${second_archive_prefix}[0-9]{4}\.md$ ) ]]; then
              permitted=true
            fi

            if [[ "$permitted" != "true" ]]; then
              echo "Unexpected file for $HEAD_BRANCH: $filename" >&2
              exit 1
            fi
          done

          if [[ "$state_changed" != "true" ]]; then
            echo "PR must modify its routine state log" >&2
            exit 1
          fi

      # Deliberately do not check out or execute code from the PR branch.
      - name: Squash merge validated state update
        shell: bash
        run: |
          set -euo pipefail
          merged="$({
            gh api --method PUT \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
              -f merge_method=squash \
              -f sha="$HEAD_SHA" \
              --jq '.merged'
          })"

          if [[ "$merged" != "true" ]]; then
            echo "GitHub did not merge PR #$PR_NUMBER" >&2
            exit 1
          fi
